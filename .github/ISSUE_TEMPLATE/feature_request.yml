name: Feature request
description: Suggest an improvement to Alpine
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Product rules
      options:
        - label: This keeps the [product rules](https://github.com/Owsper/Alpine/blob/main/CONTRIBUTING.md#product-rules), including no audio storage, no face or emotion analysis, and no hiring use.
          required: true
